plugins {
    id 'java-gradle-plugin'
    id 'dev.railroadide.quality' version '1.1.0'
    id 'maven-publish'
    id 'idea'
}

version = '1.0-SNAPSHOT'
group = 'dev.turtywurty.testgradleplugin'

gradlePlugin {
    plugins {
        testGradlePlugin {
            id = 'dev.turtywurty.testgradleplugin'
            implementationClass = 'dev.turtywurty.testgradleplugin.TestGradlePlugin'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
}

tasks.named('check') {
    dependsOn('formatCheck')
}
