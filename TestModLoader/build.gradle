plugins {
    id 'java'
    id 'dev.railroadide.quality' version '1.1.0'
    id 'dev.turtywurty.testgradleplugin' version '1.0-SNAPSHOT'
}

group = 'dev.turtywurty.testmodloader'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

testGradle {
    minecraftVersion = '26.3'
    side = 'CLIENT'
}

tasks.named('check') {
    dependsOn('formatCheck')
}

tasks.matching {
    it.name in [
        'semanticFormat',
        'semanticFormatCheck'
    ]
}.configureEach {
    dependsOn('prepareMinecraft')
}
